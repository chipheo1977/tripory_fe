packages:
  - apps/*
  - packages/*

# Chỉ cho chạy install script khi thật sự cần; pnpm >=10.26 hỗ trợ allowBuilds.
# unrs-resolver: postinstall chỉ kiểm tra/tải native binding; binding đã có qua optionalDependencies.
allowBuilds:
  unrs-resolver: false

# Một phiên bản cho cả monorepo: app/package dùng "catalog:" thay vì tự ghi version.
# Lý do: ai-memories/tripory-fe--ddd-architecture.md (mục 4, 9).
catalog:
  "@base-ui/react": 1.8.0 # D-02: giữ bản đã kiểm, không tự nâng lên 1.9.0
  "@tailwindcss/node": 4.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  jsdom: 29.1.1 # 30.x yêu cầu Node mới hơn môi trường đã chốt
  lucide-react: 1.54.0
  sonner: 2.0.8
  tailwind-merge: 3.7.0
  tw-animate-css: 1.4.0
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 20.19.43
  typescript: 5.9.3
  eslint: 9.39.5
  eslint-config-next: 16.4.0
  typescript-eslint: 8.71.1 # trùng bản eslint-config-next đang kéo về, pnpm dùng chung một bản
  vitest: 4.1.11 # nhánh 4 cuối; Vitest 5.0 (09/2026) đòi @types/node >= 22, catalog đang 20
  tailwindcss: 4.3.3
  "@tailwindcss/turbopack": 4.3.3
